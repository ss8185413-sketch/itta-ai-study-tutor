<!-- =====================================================
     ITTA LEARN - PREMIUM LOGIN
     ===================================================== -->

<div id="premiumAuthModal" class="premium-auth-modal" style="display:none;">

    <div class="premium-auth-card">

        <button
            type="button"
            class="premium-close-btn"
            onclick="closePremiumLogin()"
        >
            ✕
        </button>

        <div class="premium-auth-logo">
            ⭐
        </div>

        <h2>Itta Learn Premium</h2>

        <p id="premiumAuthTitle">
            Login করুন এবং আপনার Premium Access ফিরে পান
        </p>

        <!-- LOGIN -->

        <div id="premiumLoginForm">

            <input
                type="email"
                id="premiumLoginEmail"
                placeholder="Email address"
                autocomplete="email"
            >

            <input
                type="password"
                id="premiumLoginPassword"
                placeholder="Password"
                autocomplete="current-password"
            >

            <button
                type="button"
                onclick="premiumLogin()"
            >
                🔐 Login
            </button>

            <button
                type="button"
                class="premium-secondary-btn"
                onclick="showPremiumRegister()"
            >
                Create Premium Account
            </button>

        </div>

        <!-- REGISTER -->

        <div id="premiumRegisterForm" style="display:none;">

            <input
                type="text"
                id="premiumRegisterName"
                placeholder="Your name"
                autocomplete="name"
            >

            <input
                type="email"
                id="premiumRegisterEmail"
                placeholder="Email address"
                autocomplete="email"
            >

            <input
                type="password"
                id="premiumRegisterPassword"
                placeholder="Create password"
                autocomplete="new-password"
            >

            <button
                type="button"
                onclick="premiumRegister()"
            >
                ✨ Create Account
            </button>

            <button
                type="button"
                class="premium-secondary-btn"
                onclick="showPremiumLogin()"
            >
                Already have an account? Login
            </button>

        </div>

        <p id="premiumAuthMessage"></p>

    </div>

    </div>
